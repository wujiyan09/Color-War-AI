<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07090e">
<meta name="format-detection" content="telephone=no">
<title>Dots 局面分析器</title>
<style>
  :root{
    --bg:#07090e; --card:#0e121b; --card2:#111725; --line:#202838;
    --text:#e9edf7; --muted:#8d98ad; --faint:#5d687c;
    --red:#ff6262; --red-soft:rgba(255,98,98,.16);
    --blue:#6f97ff; --blue-soft:rgba(111,151,255,.16);
    --gold:#ffd479; --green:#5fe0a0;
    --r:16px; --n:6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);color-scheme:dark}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 520px at 8% -12%, rgba(111,151,255,.13), transparent 62%),
      radial-gradient(720px 520px at 108% 4%, rgba(255,98,98,.10), transparent 58%),
      var(--bg);
    color:var(--text);
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    user-select:none; -webkit-user-select:none;
    padding:
      max(10px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(18px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }
  button{font:inherit;color:inherit}
  .app{max-width:1180px;margin:0 auto}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 2px 12px}
  h1{font-size:clamp(19px,2.2vw,25px);line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:800}
  .sub{font-size:12px;line-height:1.5;color:var(--muted);margin-top:5px;letter-spacing:.02em}
  .badge{
    flex:0 0 auto;font-size:10px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;
    color:#bfe3ff;border:1px solid rgba(111,151,255,.35);background:rgba(111,151,255,.09);
    padding:6px 9px;border-radius:999px;white-space:nowrap
  }
  .layout{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
  @media (min-width:900px){
    .layout{grid-template-columns:minmax(0,1.35fr) minmax(330px,.82fr)}
    .board-card{position:sticky;top:10px}
  }
  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,0) 38%),var(--card);
    border:1px solid var(--line);border-radius:var(--r);padding:13px;
    box-shadow:0 16px 44px rgba(0,0,0,.30)
  }
  .board-card{padding:12px}
  .board-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .counts{display:flex;gap:7px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;color:var(--muted);
    background:#0a0e16;border:1px solid var(--line);border-radius:999px;padding:5px 9px
  }
  .chip b{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums}
  .chip i{width:8px;height:8px;border-radius:50%;display:block}
  .chip.red i{background:var(--red);box-shadow:0 0 8px rgba(255,98,98,.75)}
  .chip.blue i{background:var(--blue);box-shadow:0 0 8px rgba(111,151,255,.75)}
  .seg{
    display:inline-flex;align-items:center;gap:3px;padding:3px;
    background:#090d15;border:1px solid var(--line);border-radius:12px
  }
  .seg button{
    min-height:42px;padding:0 12px;border:0;border-radius:9px;background:transparent;
    color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.01em;cursor:pointer;
    touch-action:manipulation;transition:background .15s,color .15s,box-shadow .15s
  }
  .seg button.on{background:#1a2233;color:var(--text);box-shadow:inset 0 0 0 1px #2b3850}
  .seg button[data-turn="red"].on{background:var(--red-soft);color:#ffb9b9;box-shadow:inset 0 0 0 1px rgba(255,98,98,.42)}
  .seg button[data-turn="blue"].on{background:var(--blue-soft);color:#bcd0ff;box-shadow:inset 0 0 0 1px rgba(111,151,255,.42)}

  .board-shell{
    display:grid;grid-template-columns:16px minmax(0,1fr);grid-template-rows:16px minmax(0,1fr);
    gap:4px;width:100%;max-width:min(100%, 640px, 64vh);margin:0 auto
  }
  .coords{
    display:grid;gap:1px;color:var(--faint);
    font:650 9px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em
  }
  .coords.cols{grid-column:2;grid-row:1;align-items:end;text-align:center}
  .coords.rows{grid-column:1;grid-row:2;align-items:center;text-align:center}
  .board{
    grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));
    gap:clamp(2px,.42vw,5px);aspect-ratio:1;padding:clamp(3px,.55vw,7px);
    background:#090d15;border:1px solid #1b2333;border-radius:14px;
    box-shadow:inset 0 0 46px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.25);
    touch-action:manipulation
  }
  .cell{
    position:relative;min-width:0;min-height:0;padding:0;border:1px solid #1a2231;
    border-radius:clamp(5px,1vw,9px);background:radial-gradient(circle at 50% 45%,#121927,#0b0f18 72%);
    display:grid;place-items:center;cursor:pointer;touch-action:manipulation;aspect-ratio:1;
    transition:transform .07s ease,box-shadow .15s ease,border-color .15s ease
  }
  .cell:active{transform:scale(.94)}
  .cell.red{
    border-color:rgba(255,98,98,.40);
    background:radial-gradient(circle at 50% 40%,rgba(255,98,98,.20),rgba(255,98,98,.035) 66%,#0b0f18 100%)
  }
  .cell.blue{
    border-color:rgba(111,151,255,.40);
    background:radial-gradient(circle at 50% 40%,rgba(111,151,255,.20),rgba(111,151,255,.035) 66%,#0b0f18 100%)
  }
  .cell .pips{width:84%;height:84%;overflow:visible;pointer-events:none}
  .cell.red .pips circle{fill:var(--red);filter:drop-shadow(0 0 3px rgba(255,98,98,.65))}
  .cell.blue .pips circle{fill:var(--blue);filter:drop-shadow(0 0 3px rgba(111,151,255,.65))}
  .cell.last{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
  .cell.suggest{
    border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(255,212,121,.8),0 0 24px rgba(255,212,121,.35);
    z-index:2
  }
  .cell.suggest::after{
    content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 9px var(--gold)
  }
  .cell.flash{animation:cellFlash .55s ease}
  @keyframes cellFlash{0%{filter:brightness(2.2) saturate(1.3)}100%{filter:none}}
  .board.locked .cell{cursor:default}
  .board.locked .cell:active{transform:none}
  .board.locked{box-shadow:inset 0 0 46px rgba(0,0,0,.5),0 0 0 1px rgba(255,212,121,.18),0 12px 30px rgba(0,0,0,.25)}
  #btn-lock.on{color:var(--gold);border-color:rgba(255,212,121,.5);background:rgba(255,212,121,.08)}

  .palette{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}
  .palette .label{font-size:10px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-right:2px}
  .pbtn{
    min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);
    background:#0a0e16;color:var(--muted);font-size:12.5px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;touch-action:manipulation
  }
  .pbtn .sw{width:9px;height:9px;border-radius:50%;display:block;background:#39445a}
  .pbtn.red{color:#ffb9b9}
  .pbtn.red .sw{background:var(--red);box-shadow:0 0 7px rgba(255,98,98,.6)}
  .pbtn.blue{color:#bcd0ff}
  .pbtn.blue .sw{background:var(--blue);box-shadow:0 0 7px rgba(111,151,255,.6)}
  .pbtn.on{border-color:rgba(255,255,255,.5);background:#1a2233;color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .pbtn.red.on{border-color:rgba(255,98,98,.75);background:rgba(255,98,98,.14);color:#ffd0d0}
  .pbtn.blue.on{border-color:rgba(111,151,255,.75);background:rgba(111,151,255,.14);color:#d6e2ff}

  .actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}
  .size-seg{margin-left:auto}
  .size-seg button{min-height:36px;padding:0 9px;font-size:11.5px}
  .btn{
    min-height:46px;padding:0 13px;border-radius:11px;border:1px solid var(--line);
    background:#121927;color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;
    touch-action:manipulation;transition:transform .07s,background .15s,border-color .15s
  }
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn.ghost:hover{border-color:#354159;color:var(--text)}
  .btn.primary{
    background:linear-gradient(180deg,#82a7ff,#4f7df0);border-color:#91afff;color:#061021;
    font-weight:850;box-shadow:0 9px 26px rgba(79,125,240,.35)
  }
  .btn.primary:disabled{opacity:.55;box-shadow:none;cursor:default}
  .btn.wide{width:100%;margin-top:10px}
  .btn[hidden]{display:none}

  .panel{display:flex;flex-direction:column;gap:14px}
  .card h2{
    margin:0 0 10px;font-size:10px;font-weight:800;letter-spacing:.15em;
    text-transform:uppercase;color:var(--faint)
  }
  .budget{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
  .budget button{padding:0;min-height:44px}
  #status{margin-top:9px;font-size:11.5px;line-height:1.5;color:var(--faint);min-height:17px}
  #status.err{color:#ff9d9d}
  #status.ok{color:#9fe9c6}

  .hint{font-size:12.5px;line-height:1.65;color:var(--muted)}
  .hint b{color:var(--text)}
  .thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:4px 0}
  .spinner{
    width:17px;height:17px;border-radius:50%;border:2px solid #2a3448;border-top-color:var(--gold);
    animation:spin .8s linear infinite;flex:0 0 auto
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .best{display:flex;align-items:center;gap:14px}
  .best .coord{
    font:850 clamp(35px,6vw,46px)/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--gold);letter-spacing:.01em;text-shadow:0 0 24px rgba(255,212,121,.35)
  }
  .best .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
  .best .title{font-size:13px;font-weight:700;color:var(--text)}
  .best .sub{font-size:11.5px;color:var(--muted)}
  .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:12px}
  .metric{background:#090d15;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
  .metric b{display:block;font-size:14px;line-height:1.2;color:var(--text);font-variant-numeric:tabular-nums}
  .metric span{display:block;margin-top:2px;font-size:9.5px;letter-spacing:.06em;color:var(--faint)}
  .note{margin-top:9px;font-size:10.5px;line-height:1.5;color:var(--faint)}
  .winner{
    display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:12px;
    background:rgba(95,224,160,.10);border:1px solid rgba(95,224,160,.32);
    color:#c7ffe4;font-size:14px;font-weight:800
  }
  .winner .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  .log-list{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow:auto;overscroll-behavior:contain}
  .log-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:11.5px;color:var(--muted);background:#090d15;border:1px solid #171f2d;
    border-radius:9px;padding:7px 9px
  }
  .log-item b{color:var(--text);font-weight:750}
  .log-item .r{color:#ffb9b9}
  .log-item .b{color:#bcd0ff}

  .modal{
    position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    padding:18px;background:rgba(3,5,9,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)
  }
  .modal[hidden]{display:none}
  .modal-card{
    width:min(560px,100%);max-height:calc(100dvh - 36px);overflow:auto;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
    box-shadow:0 30px 80px rgba(0,0,0,.55)
  }
  .modal-card h3{margin:0 0 6px;font-size:17px;letter-spacing:-.01em}
  .modal-card p{margin:0 0 12px;font-size:12px;line-height:1.6;color:var(--muted)}
  .howto{
    margin:0 0 12px;padding:10px 11px;border-radius:11px;border:1px solid rgba(255,212,121,.22);
    background:rgba(255,212,121,.055);color:#d9c9a2;font-size:11.5px;line-height:1.65
  }
  .howto b{color:#ffe1a3}
  .howto a{color:#ffd479}
  .modal-card textarea{
    width:100%;min-height:132px;resize:vertical;padding:10px 11px;border-radius:11px;
    border:1px solid var(--line);background:#090d15;color:var(--text);
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    user-select:text;-webkit-user-select:text;outline:none
  }
  .modal-card textarea:focus{border-color:rgba(111,151,255,.6);box-shadow:0 0 0 3px rgba(111,151,255,.14)}
  .modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .modal-actions .btn{flex:1 1 auto}
  .modal-actions .btn.primary{flex:1.4 1 auto}

  @media (max-width:520px){
    .badge{display:none}
    .board-top{gap:6px}
    .seg button{padding:0 9px;font-size:12px}
    .pbtn{min-height:38px;padding:0 8px}
    .actions .btn{padding:0 10px}
    .size-seg{margin-left:0}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Dots 局面分析器</h1>
      <div class="sub">Chain Reaction · 同一套本地引擎 · 可编辑双方局面</div>
    </div>
    <div class="badge">iPad ready</div>
  </header>

  <div class="layout">
    <section class="card board-card">
      <div class="board-top">
        <div class="seg" id="turn-seg" role="group" aria-label="轮到谁走">
          <button type="button" data-turn="red" class="on">红方走</button>
          <button type="button" data-turn="blue">蓝方走</button>
        </div>
        <div class="counts">
          <span class="chip red"><i></i>红 <b id="count-red">1</b></span>
          <span class="chip blue"><i></i>蓝 <b id="count-blue">1</b></span>
        </div>
      </div>

      <div class="board-shell">
        <div class="coords cols" id="cols" aria-hidden="true"></div>
        <div class="coords rows" id="rows" aria-hidden="true"></div>
        <div class="board" id="board" role="grid" aria-label="棋盘"></div>
      </div>

      <div class="palette" id="palette" role="group" aria-label="画笔">
        <span class="label">画笔</span>
      </div>
      <div class="actions">
        <button class="btn ghost" id="btn-initial" type="button">初始局面</button>
        <button class="btn ghost" id="btn-demo" type="button">示例</button>
        <button class="btn ghost" id="btn-import" type="button">导入</button>
        <button class="btn ghost" id="btn-clear" type="button">清空</button>
        <button class="btn ghost" id="btn-undo" type="button">撤销</button>
        <button class="btn ghost" id="btn-lock" type="button">锁定</button>
        <div class="seg size-seg" id="size-seg" role="group" aria-label="棋盘尺寸">
          <button type="button" data-size="6" class="on">6×6</button>
          <button type="button" data-size="9">9×9</button>
          <button type="button" data-size="12">12×12</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <section class="card">
        <h2>搜索预算</h2>
        <div class="seg budget" id="budget-seg" role="group" aria-label="搜索时间">
          <button type="button" data-budget="500">0.5s</button>
          <button type="button" data-budget="1000">1s</button>
          <button type="button" data-budget="2000" class="on">2s</button>
          <button type="button" data-budget="5000">5s</button>
        </div>
        <button class="btn primary wide" id="btn-compute" type="button">计算最优解</button>
        <div id="status">引擎在本地运行，棋盘不会上传。</div>
      </section>

      <section class="card">
        <h2>引擎推荐</h2>
        <div id="result-body"></div>
        <button class="btn wide" id="btn-apply" type="button" hidden>应用此手</button>
      </section>

      <section class="card">
        <h2>操作记录</h2>
        <div class="log-list" id="log-list">
          <div class="hint">还没有应用过走法。</div>
        </div>
      </section>
    </aside>
  </div>
</div>

<div class="modal" id="import-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="import-title">
    <h3 id="import-title">导入局面</h3>
    <div class="howto">
      当前对局会由 iOS 自动传入此离线分析器。此页中的编辑和“应用此手”仅作用于分析副本，不会改动原对局。
    </div>
    <p>也可以手动导入局面代码。格式：<code>DOTS1|尺寸|行棋方|坐标…</code></p>
    <textarea id="import-text" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="DOTS1|6|red|0,0,r,1;1,0,r,3;…"></textarea>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="import-clip">读剪贴板</button>
      <button class="btn ghost" type="button" id="import-cancel">取消</button>
      <button class="btn primary" type="button" id="import-ok">导入局面</button>
    </div>
  </div>
</div>

<script>
window.__dotsEngine = (function(){

<script>
(function(){
  'use strict';

  var $ = function(sel, root){ return (root || document).querySelector(sel); };
  var SIZES = [6, 9, 12];
  var STORE_KEY = 'dots-analyzer-v1';
  var DEMO_6 = [
    'r1 r3 r1 .. .. ..',
    '.. r1 r1 .. .. ..',
    'r1 r3 .. .. .. ..',
    'r2 .. .. .. b2 b3',
    '.. .. .. b3 .. b3',
    '.. .. .. b1 b3 ..'
  ];
  var PAINTS = {
    erase: null,
    red1: { color:'red', charge:1 },
    red2: { color:'red', charge:2 },
    red3: { color:'red', charge:3 },
    blue1:{ color:'blue', charge:1 },
    blue2:{ color:'blue', charge:2 },
    blue3:{ color:'blue', charge:3 }
  };
  var PAINT_DEFS = [
    ['erase','空',null],
    ['red1','红 1','red'],
    ['red2','红 2','red'],
    ['red3','红 3','red'],
    ['blue1','蓝 1','blue'],
    ['blue2','蓝 2','blue'],
    ['blue3','蓝 3','blue']
  ];
  var PIPS = {
    1: [[15,15]],
    2: [[10.5,10.5],[19.5,19.5]],
    3: [[15,8.5],[9.5,20.5],[20.5,20.5]]
  };

  function emptyBoard(n){
    var b = [];
    for (var y=0; y<n; y++){
      var row = [];
      for (var x=0; x<n; x++) row.push(null);
      b.push(row);
    }
    return b;
  }
  function initialBoard(n){
    var b = emptyBoard(n);
    b[0][0] = { color:'red', charge:1 };
    b[n-1][n-1] = { color:'blue', charge:1 };
    return b;
  }
  function cloneBoard(b){
    return b.map(function(row){
      return row.map(function(c){ return c ? { color:c.color, charge:c.charge } : null; });
    });
  }
  function countColors(b){
    var red=0, blue=0;
    for (var y=0; y<b.length; y++) for (var x=0; x<b.length; x++){
      var c=b[y][x];
      if (!c) continue;
      if (c.color==='red') red++; else blue++;
    }
    return { red:red, blue:blue };
  }
  function parsePreset(rows){
    var n = rows.length;
    var b = emptyBoard(n);
    for (var y=0; y<n; y++){
      var toks = rows[y].trim().split(/\s+/);
      for (var x=0; x<n; x++){
        var t = toks[x];
        if (!t || t==='..') continue;
        b[y][x] = { color: t.charAt(0)==='r' ? 'red' : 'blue', charge: Number(t.charAt(1)) };
      }
    }
    return b;
  }

  var state = {
    size: 6,
    board: initialBoard(6),
    turn: 'red',
    paint: 'red1',
    budget: 2000,
    result: null,
    thinking: false,
    winner: null,
    lastMove: null,
    flash: new Set(),
    log: [],
    moveNo: 0,
    history: [],
    locked: false,
    _coordSize: 0
  };

  var reqId = 0;
  var statusTimer = null;

  function coord(x, y){ return String.fromCharCode(65 + x) + (state.size - y); }
  function keyOf(x, y){ return x + ',' + y; }
  function fmtScore(s){
    if (s >= 900000) return '必胜';
    if (s <= -900000) return '危险';
    return (s > 0 ? '+' : '') + s;
  }
  function fmtNodes(n){
    if (!n) return '0';
    if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n/1000).toFixed(1) + 'k';
    return String(n);
  }
  function pipSvg(color, charge){
    var pts = PIPS[Math.max(1, Math.min(3, charge))] || PIPS[1];
    var circles = pts.map(function(p){
      return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.7"></circle>';
    }).join('');
    return '<svg class="pips" viewBox="0 0 30 30" aria-hidden="true">' + circles + '</svg>';
  }

  function toast(msg, isErr){
    var el = $('#status');
    el.textContent = msg;
    el.className = isErr ? 'err' : 'ok';
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(function(){
      el.className = '';
      el.textContent = '引擎在本地运行，棋盘不会上传。';
    }, 3600);
  }

  function pushHistory(){
    state.history.push({
      size: state.size,
      board: cloneBoard(state.board),
      turn: state.turn,
      winner: state.winner,
      lastMove: state.lastMove,
      log: state.log.slice(),
      moveNo: state.moveNo
    });
    if (state.history.length > 80) state.history.shift();
  }

  function undo(){
    if (!state.history.length){ toast('没有可撤销的操作', true); return; }
    var h = state.history.pop();
    state.size = h.size;
    state.board = h.board;
    state.turn = h.turn;
    state.winner = h.winner;
    state.lastMove = h.lastMove;
    state.log = h.log;
    state.moveNo = h.moveNo;
    state.result = null;
    state.thinking = false;
    state.flash.clear();
    state._coordSize = 0;
    save();
    render();
  }

  function paintCell(x, y){
    if (state.locked){ toast('棋盘已锁定，点“解锁”后可编辑', true); return; }
    var spec = PAINTS[state.paint];
    var cur = state.board[y] && state.board[y][x];
    if (!spec && !cur) return;
    pushHistory();
    if (spec) state.board[y][x] = { color: spec.color, charge: spec.charge };
    else state.board[y][x] = null;
    state.result = null;
    state.winner = null;
    state.lastMove = null;
    state.flash.clear();
    save();
    render();
  }

  function applyMove(board, x, y, color){
    var b = cloneBoard(board);
    var cell = b[y] && b[y][x];
    if (!cell || cell.color !== color) throw new Error('该格不属于行棋方');
    cell.charge += 1;
    var changed = new Set([keyOf(x, y)]);
    var waves = 0;
    var winner = null;
    for (var guard=0; guard<5000; guard++){
      var crit = [];
      for (var yy=0; yy<b.length; yy++) for (var xx=0; xx<b.length; xx++){
        var c = b[yy][xx];
        if (c && c.charge >= 4) crit.push([xx, yy]);
      }
      if (!crit.length) break;
      waves++;
      for (var i=0; i<crit.length; i++){
        var cx = crit[i][0], cy = crit[i][1];
        var firing = b[cy][cx];
        if (!firing) continue;
        var col = firing.color;
        b[cy][cx] = null;
        changed.add(keyOf(cx, cy));
        for (var d=0; d<4; d++){
          var nx = cx + (d===0?1:d===1?-1:0);
          var ny = cy + (d===2?1:d===3?-1:0);
          if (nx<0 || ny<0 || nx>=b.length || ny>=b.length) continue;
          var t = b[ny][nx];
          changed.add(keyOf(nx, ny));
          if (!t){ b[ny][nx] = { color: col, charge: 1 }; }
          else if (t.color === col){ t.charge += 1; }
          else { b[ny][nx] = { color: col, charge: t.charge + 1 }; }
        }
        var cc = countColors(b);
        if (cc.red === 0 || cc.blue === 0){
          winner = cc.red === 0 ? 'blue' : 'red';
          return { board:b, waves:waves, counts:cc, winner:winner, changed:changed };
        }
      }
    }
    var finalCounts = countColors(b);
    if (finalCounts.red === 0 || finalCounts.blue === 0) winner = finalCounts.red === 0 ? 'blue' : 'red';
    return { board:b, waves:waves, counts:finalCounts, winner:winner, changed:changed };
  }

  function validate(){
    var c = countColors(state.board);
    if (!c.red) return '请至少放置一个红子';
    if (!c.blue) return '请至少放置一个蓝子';
    if (c[state.turn] === 0) return '轮到的一方没有棋子';
    for (var y=0; y<state.size; y++) for (var x=0; x<state.size; x++){
      var cell = state.board[y][x];
      if (cell && (cell.charge < 1 || cell.charge > 3)) return '电荷只能是 1–3；4 级会立刻爆炸';
    }
    return null;
  }

  function encodeState(){
    var parts = [];
    for (var y=0; y<state.size; y++) for (var x=0; x<state.size; x++){
      var c = state.board[y][x];
      if (c) parts.push(x + ',' + y + ',' + (c.color === 'red' ? 'r' : 'b') + ',' + c.charge);
    }
    return 'DOTS1|' + state.size + '|' + state.turn + '|' + parts.join(';');
  }

  function parseStateCode(raw){
    raw = String(raw || '').trim();
    var m = /^DOTS1\|(\d+)\|(red|blue)\|(.*)$/.exec(raw);
    if (!m) throw new Error('局面代码格式不正确');
    var n = Number(m[1]);
    if (!SIZES.includes(n)) throw new Error('只支持 6、9、12 三种尺寸');
    var board = emptyBoard(n);
    var body = m[3].trim();
    if (body){
      var parts = body.split(';');
      for (var i=0; i<parts.length; i++){
        var p = parts[i].split(',');
        if (p.length !== 4) throw new Error('第 ' + (i+1) + ' 个格子格式错误');
        var x = Number(p[0]), y = Number(p[1]), ch = Number(p[3]);
        if (!(x >= 0 && y >= 0 && x < n && y < n)) throw new Error('坐标越界：' + parts[i]);
        if (p[2] !== 'r' && p[2] !== 'b') throw new Error('颜色错误：' + parts[i]);
        if (!(ch >= 1 && ch <= 3)) throw new Error('电荷只能是 1–3：' + parts[i]);
        if (board[y][x]) throw new Error('坐标重复：' + parts[i]);
        board[y][x] = { color: p[2] === 'r' ? 'red' : 'blue', charge: ch };
      }
    }
    return { size:n, turn:m[2], board:board };
  }

  function applyImported(parsed, quiet){
    pushHistory();
    state.size = parsed.size;
    state.board = parsed.board;
    state.turn = parsed.turn;
    state.result = null;
    state.winner = null;
    state.lastMove = null;
    state.log = [];
    state.moveNo = 0;
    state.locked = false;
    state.flash.clear();
    state._coordSize = 0;
    save();
    render();
    if (!quiet){
      var c = countColors(parsed.board);
      toast('已导入 ' + parsed.size + '×' + parsed.size + ' 局面（红 ' + c.red + ' / 蓝 ' + c.blue + '），轮到' + (parsed.turn === 'red' ? '红' : '蓝') + '方');
    }
  }

  function importStateCode(code, quiet){
    applyImported(parseStateCode(code), quiet);
  }

  function openImport(){
    var modal = $('#import-modal');
    modal.hidden = false;
    var ta = $('#import-text');
    ta.value = '';
    setTimeout(function(){ ta.focus(); }, 40);
    if (navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(t){
        if (t && /^DOTS1\|/.test(t.trim())) ta.value = t.trim();
      }).catch(function(){});
    }
  }

  function closeImport(){
    $('#import-modal').hidden = true;
  }

  function readClipboard(){
    if (!(navigator.clipboard && navigator.clipboard.readText)){
      toast('此浏览器不支持直接读剪贴板，请长按输入框粘贴', true);
      return;
    }
    navigator.clipboard.readText().then(function(t){
      if (t && t.trim()) $('#import-text').value = t.trim();
      else toast('剪贴板是空的', true);
    }).catch(function(){ toast('读取剪贴板被拒绝，请手动粘贴', true); });

  function importFromModal(){

  function readHashState(){
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return null;
    var code = '';
    var auto = false;
    if (h.indexOf('DOTS1|') === 0 || h.indexOf('DOTS1%7C') === 0){
      code = decodeURIComponent(h);
    } else {
      try {
        var hp = new URLSearchParams(h);
        code = hp.get('s') || '';
        auto = hp.get('auto') === '1';
      } catch(e){}
    }
    if (!code) return null;
    try {
      var st = parseStateCode(code);
      st.auto = auto;
      return st;
    } catch(e){ return null; }
  }


  function askInline(msg){
    return new Promise(function(resolve, reject){
      setTimeout(function(){
        try {
          var out = window.__dotsEngine && window.__dotsEngine.onmessage(msg);
          if (!out) throw new Error('引擎无响应');
          resolve(Object.assign({}, out, { mode:'inline' }));
        } catch(e){ reject(e); }
      }, 30);
    });
  }

  async function compute(){
    if (state.thinking) return;
    var err = validate();
    if (err){ toast(err, true); return; }
    state.thinking = true;
    state.result = null;
    state.winner = null;
    state.flash.clear();
    render();
    var payload = {
      kind: 'botpick',
      id: ++reqId,
      board: cloneBoard(state.board),
      mover: state.turn,
      movesRed: 20,
      movesBlue: 20,
      timeMs: state.budget,
      maxDepth: (function(){
        var v = Number(new URLSearchParams(location.search).get('maxdepth'));
        return v >= 1 && v <= 32 ? v : 32;
      })()
    };
    var t0 = performance.now();
    try {
      var data = await askInline(payload);
      var r = data && data.result;
      if (!r || typeof r.x !== 'number' || r.x < 0) throw new Error('没有找到合法走法');
      state.result = {
        x: r.x, y: r.y,
        score: r.score, depth: r.depth,
        nodes: r.nodes, elapsedMs: r.elapsedMs,
        wallMs: Math.round(performance.now() - t0),
        mode: data.mode
      };
      state.thinking = false;
      render();
    } catch(e){
      state.thinking = false;
      render();
      toast('计算失败：' + (e && e.message ? e.message : String(e)), true);
    }
  }

  function applyBest(){
    if (!state.result || state.thinking) return;
    var r = state.result;
    var cell = state.board[r.y] && state.board[r.y][r.x];
    if (!cell || cell.color !== state.turn){ toast('棋盘已变化，请重新计算', true); return; }
    pushHistory();
    var out = applyMove(state.board, r.x, r.y, state.turn);
    state.board = out.board;
    state.lastMove = { x:r.x, y:r.y, by:state.turn };
    state.flash = out.changed;
    state.result = null;
    state.moveNo++;
    state.log.unshift({
      no: state.moveNo,
      by: state.turn,
      coord: coord(r.x, r.y),
      waves: out.waves,
      counts: out.counts,
      winner: out.winner
    });
    state.log = state.log.slice(0, 12);
    if (out.winner){
      state.winner = out.winner;
      state.turn = out.winner === 'red' ? 'blue' : 'red';
    } else {
      state.turn = state.turn === 'red' ? 'blue' : 'red';
    }
    save();
    render();
    setTimeout(function(){ state.flash.clear(); render(); }, 650);
  }

  function buildCoords(){
    var n = state.size;
    var cols = $('#cols'), rows = $('#rows');
    cols.innerHTML = '';
    rows.innerHTML = '';
    cols.style.gridTemplateColumns = 'repeat(' + n + ',1fr)';
    rows.style.gridTemplateRows = 'repeat(' + n + ',1fr)';
    for (var x=0; x<n; x++){
      var s = document.createElement('span');
      s.textContent = String.fromCharCode(65 + x);
      cols.appendChild(s);
    }
    for (var y=0; y<n; y++){
      var r = document.createElement('span');
      r.textContent = String(n - y);
      rows.appendChild(r);
    }
  }

  function renderBoard(){
    var n = state.size;
    var boardEl = $('#board');
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = 'repeat(' + n + ',minmax(0,1fr))';
    boardEl.setAttribute('aria-label', n + '×' + n + ' 棋盘');
    var frag = document.createDocumentFragment();
    for (var y=0; y<n; y++) for (var x=0; x<n; x++){
      var cell = state.board[y][x];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cell';
      btn.dataset.x = x;
      btn.dataset.y = y;
      btn.setAttribute('role','gridcell');
      var label = coord(x, y);
      if (cell) label += '，' + (cell.color === 'red' ? '红' : '蓝') + ' ' + cell.charge;
      else label += '，空';
      if (state.result && state.result.x === x && state.result.y === y) label += '，推荐落子';
      btn.setAttribute('aria-label', label);
      if (cell){
        btn.classList.add(cell.color);
        btn.innerHTML = pipSvg(cell.color, cell.charge);
      }
      if (state.lastMove && state.lastMove.x === x && state.lastMove.y === y) btn.classList.add('last');
      if (state.result && state.result.x === x && state.result.y === y) btn.classList.add('suggest');
      if (state.flash.has(keyOf(x, y))) btn.classList.add('flash');
      frag.appendChild(btn);
    }
    boardEl.appendChild(frag);
  }

  function renderCounts(){
    var c = countColors(state.board);
    $('#count-red').textContent = c.red;
    $('#count-blue').textContent = c.blue;
  }

  function renderTurn(){
    document.querySelectorAll('#turn-seg [data-turn]').forEach(function(b){
      var on = b.dataset.turn === state.turn;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

  function renderPalette(){
    document.querySelectorAll('#palette [data-paint]').forEach(function(b){
      b.classList.toggle('on', b.dataset.paint === state.paint);
      b.setAttribute('aria-pressed', b.dataset.paint === state.paint ? 'true' : 'false');
    });
  }

  function renderLock(){
    var btn = $('#btn-lock');
    btn.classList.toggle('on', state.locked);
    btn.textContent = state.locked ? '解锁' : '锁定';
    btn.setAttribute('aria-pressed', state.locked ? 'true' : 'false');
    $('#board').classList.toggle('locked', state.locked);
    $('#palette').style.opacity = state.locked ? '.55' : '';
  }

  function renderResult(){
    var body = $('#result-body');
    var apply = $('#btn-apply');
    if (state.winner){
      body.innerHTML = '<div class="winner"><span class="dot"></span>' +
        (state.winner === 'red' ? '红方获胜' : '蓝方获胜') + '，棋盘已清空一方。</div>';
      apply.hidden = true;
      return;
    }
    if (state.thinking){
      body.innerHTML = '<div class="thinking"><span class="spinner"></span>搜索中…</div>';
      apply.hidden = true;
      return;
    }
    if (!state.result){
      body.innerHTML = '<div class="hint">先编辑局面，再点“计算最优解”。<br>推荐结果会以金色框标在棋盘上。</div>';
      apply.hidden = true;
      return;
    }
    var r = state.result;
    var side = state.turn === 'red' ? '红方' : '蓝方';
    var scoreClass = r.score >= 900000 ? 'good' : (r.score <= -900000 ? 'bad' : '');
    body.innerHTML =
      '<div class="best">' +
        '<div class="coord">' + coord(r.x, r.y) + '</div>' +
        '<div class="meta">' +
          '<div class="title">' + side + '推荐落子</div>' +
          '<div class="sub">评分 ' + fmtScore(r.score) + ' · ' + side + '视角</div>' +
        '</div>' +
      '</div>' +
      '<div class="metrics">' +
        '<div class="metric"><b>' + r.depth + '</b><span>搜索深度</span></div>' +
        '<div class="metric"><b>' + fmtNodes(r.nodes) + '</b><span>节点数</span></div>' +
        '<div class="metric"><b>' + (r.elapsedMs/1000).toFixed(1) + 's</b><span>引擎用时</span></div>' +
        '<div class="metric"><b>本地</b><span>运行模式</span></div>' +
      '</div>' +
      '<div class="note ' + scoreClass + '">限时搜索，不保证数学意义上的全局最优；增加预算通常更准。应用后会自动结算连锁并切换行棋方。</div>';
    apply.hidden = false;
  }

  function renderLog(){
    var list = $('#log-list');
    if (!state.log.length){
      list.innerHTML = '<div class="hint">还没有应用过走法。</div>';
      return;
    }
    list.innerHTML = state.log.map(function(it){
      var side = it.by === 'red' ? '<span class="r">红</span>' : '<span class="b">蓝</span>';
      var win = it.winner ? ' · 终局' : '';
      return '<div class="log-item">' +
        '<span><b>' + it.no + '.</b> ' + side + ' ' + it.coord + '</span>' +
        '<span>' + it.waves + ' 波 · 红' + it.counts.red + ' / 蓝' + it.counts.blue + win + '</span>' +
      '</div>';
    }).join('');
  }

  function updateControls(){
    var btn = $('#btn-compute');
    btn.disabled = state.thinking || !!state.winner;
    btn.textContent = state.thinking ? '计算中…' : '计算最优解';
    document.querySelectorAll('#size-seg [data-size]').forEach(function(b){
      b.classList.toggle('on', Number(b.dataset.size) === state.size);
    });
    document.querySelectorAll('#budget-seg [data-budget]').forEach(function(b){
      b.classList.toggle('on', Number(b.dataset.budget) === state.budget);
    });
  }

  function render(){
    document.documentElement.style.setProperty('--n', state.size);
    if (state._coordSize !== state.size){ buildCoords(); state._coordSize = state.size; }
    renderBoard();
    renderCounts();
    renderTurn();
    renderPalette();
    renderLock();
    renderResult();
    renderLog();
    updateControls();
  }

  function save(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        v: 1,
        size: state.size,
        board: state.board,
        turn: state.turn,
        budget: state.budget,
        winner: state.winner,
        lastMove: state.lastMove,
        log: state.log,
        moveNo: state.moveNo,
        locked: state.locked
      }));
    } catch(e){}
  }

  function loadSaved(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || !SIZES.includes(d.size) || !Array.isArray(d.board) || d.board.length !== d.size) return false;
      var b = [];
      for (var y=0; y<d.size; y++){
        if (!Array.isArray(d.board[y]) || d.board[y].length !== d.size) return false;
        var row = [];
        for (var x=0; x<d.size; x++){
          var c = d.board[y][x];
          if (!c){ row.push(null); continue; }
          if ((c.color !== 'red' && c.color !== 'blue') || !(c.charge >= 1 && c.charge <= 3)) return false;
          row.push({ color:c.color, charge:c.charge });
        }
        b.push(row);
      }
      state.size = d.size;
      state.board = b;
      state.turn = d.turn === 'blue' ? 'blue' : 'red';
      state.budget = [500,1000,2000,5000].includes(d.budget) ? d.budget : 2000;
      state.winner = d.winner === 'red' || d.winner === 'blue' ? d.winner : null;
      state.lastMove = d.lastMove && typeof d.lastMove.x === 'number' ? d.lastMove : null;
      state.log = Array.isArray(d.log) ? d.log.slice(0,12) : [];
      state.moveNo = Number(d.moveNo) || 0;
      state.locked = !!d.locked;
      return true;
    } catch(e){ return false; }
  }

  function initPalette(){
    var pal = $('#palette');
    PAINT_DEFS.forEach(function(d){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pbtn' + (d[2] ? ' ' + d[2] : '');
      b.dataset.paint = d[0];
      b.setAttribute('aria-label', d[1]);
      b.innerHTML = '<span class="sw"></span>' + d[1];
      pal.appendChild(b);
    });
  }

  function init(){
    initPalette();

    $('#board').addEventListener('click', function(e){
      var btn = e.target.closest('.cell');
      if (!btn) return;
      paintCell(Number(btn.dataset.x), Number(btn.dataset.y));
    });

    $('#turn-seg').addEventListener('click', function(e){
      var b = e.target.closest('[data-turn]');

      save();

    $('#budget-seg').addEventListener('click', function(e){
      var b = e.target.closest('[data-budget]');

    $('#btn-compute').addEventListener('click', compute);
    $('#btn-apply').addEventListener('click', applyBest);

    $('#import-modal').addEventListener('click', function(e){

    document.addEventListener('keydown', function(e){

    });
    $('#btn-lock').addEventListener('click', function(){
      state.locked = !state.locked;

    });

    window.addEventListener('beforeunload', save);

    var params = new URLSearchParams(location.search);
    var hasDemo = params.has('demo') || params.has('selftest');
    var loaded = loadSaved();
    if (!loaded){
      state.size = 6;
      state.board = initialBoard(6);

    }
    if (hasDemo){
      state.size = 6;

      state.lastMove = null;
      state.log = [];

      state.locked = false;
    }

    if (!hasDemo && SIZES.includes(sizeParam)){
      state.size = sizeParam;
      state.board = initialBoard(sizeParam);
      state.turn = 'red';
      state.winner = null;
      state.lastMove = null;
      state.log = [];
      state.moveNo = 0;
      state.locked = false;
    }
    var hashState = readHashState();
    var hashAuto = !!(hashState && hashState.auto);
    if (hashState){
      state.size = hashState.size;
      state.board = hashState.board;
      state.turn = hashState.turn;
      state.winner = null;
      state.lastMove = null;
      state.log = [];
      state.moveNo = 0;
      state.locked = false;
    }
    state.history = [];
    state.result = null;
    state.thinking = false;
    state.flash.clear();
    state._coordSize = 0;
    render();

    $('#status').textContent = '引擎已加载；计算在本地运行，期间页面会短暂无响应。';
    if (!window.__dotsEngine){
      $('#status').textContent = '引擎加载失败：请使用 Safari 14+ / 较新的浏览器。';
      $('#status').className = 'err';
    }

    if (hashAuto) setTimeout(compute, 400);

    window.__dots = {
      state: state,
      compute: compute,
      applyBest: applyBest,
      applyMove: applyMove,
      askInline: askInline,
      render: render,
      parsePreset: parsePreset,
      coord: coord,
      loadDemo: loadDemo,
      encodeState: encodeState,
      parseStateCode: parseStateCode,
      importStateCode: importStateCode
    };

    if (params.has('selftest')) runSelfTest();
    if (params.has('import')) setTimeout(openImport, 180);
    if (params.has('analyze')) setTimeout(compute, 200);
    if (params.has('apply')) setTimeout(async function(){ await compute(); applyBest(); }, 200);

    window.addEventListener('hashchange', function(){
      var hs = readHashState();
      if (!hs) return;
      try {
        applyImported(hs, true);
        toast('已从链接导入局面');
        if (hs.auto) setTimeout(compute, 300);
      } catch(e){}
    });
  }

  async function runSelfTest(){
    var out = {};
    try {
      state.size = 6;
      state.board = parsePreset(DEMO_6);
      state.turn = 'red';
      state.result = null;
      state.winner = null;
      render();

      var round = parseStateCode(encodeState());
      var roundCounts = countColors(round.board);
      out.roundTrip = round.size === 6 && round.turn === 'red' &&
        roundCounts.red === 8 && roundCounts.blue === 6;

      var base = {
        kind: 'botpick',
        board: cloneBoard(state.board),
        mover: 'red',
        movesRed: 20,
        movesBlue: 20,
        timeMs: 5000,
        maxDepth: 3
      };
      var ir = await askInline(Object.assign({ id: 99002 }, base));
      var ires = ir && ir.result;
      out.inline = ires ? { x:ires.x, y:ires.y, depth:ires.depth, score:ires.score } : { error:'no inline result' };
      out.depthOk = !!ires && ires.depth === 3;
      var applied = applyMove(state.board, ires.x, ires.y, 'red');
      out.apply = { waves: applied.waves, counts: applied.counts, winner: applied.winner };
      var stable = applied.board.every(function(row){
        return row.every(function(c){ return !c || (c.charge >= 1 && c.charge <= 3); });
      });
      out.stable = !!applied.winner || stable;
      out.pass = !!out.roundTrip && !!out.depthOk && !!out.stable && applied.counts.red > 0 && applied.counts.blue > 0;
    } catch(e){
      out.error = String(e && e.stack || e);
      out.pass = false;
    }
    var pre = document.createElement('pre');
    pre.id = 'selftest';
    pre.textContent = JSON.stringify(out, null, 2);
    document.body.appendChild(pre);
    document.title = 'SELFTEST ' + (out.pass ? 'PASS' : 'FAIL');
  }

  init();
})();
</script>

</html>
