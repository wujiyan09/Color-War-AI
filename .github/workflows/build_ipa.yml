name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          set -euo pipefail

          # 自动获取 Scheme 名称
          SCHEME_NAME=$(xcodebuild -list -json | jq -r '(.workspace.schemes // .package.schemes // .project.schemes)[0] // empty')

          if [ -z "$SCHEME_NAME" ]; then
            echo "ERROR: 无法解析 Scheme"
            xcodebuild -list
            exit 1
          fi

          echo "Detected Scheme: $SCHEME_NAME"
          mkdir -p build

          xcodebuild archive \
            -scheme "$SCHEME_NAME" \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COREML_CODEGEN_LANGUAGE=Swift

      - name: Package Unsigned IPA & ZIP
        run: |
          set -euo pipefail

          mkdir -p build/Payload

          APP_PATH=$(find build/App.xcarchive -maxdepth 6 -name '*.app' -type d -print -quit || true)

          if [ -n "$APP_PATH" ]; then
            echo "Found standard .app bundle at: $APP_PATH"
            cp -R "$APP_PATH" build/Payload/
          elif [ -d "build/App.xcarchive/Products/usr/local/bin" ]; then
            echo "Detected executable binary in usr/local/bin, constructing .app bundle..."
            
            # 获取可执行文件名（排除 CoreML 模型等目录）
            BIN_NAME=$(ls build/App.xcarchive/Products/usr/local/bin | grep -v '\.mlmodelc$' | head -n 1)
            
            if [ -z "$BIN_NAME" ]; then
              echo "ERROR: Could not find binary in usr/local/bin"
              exit 1
            fi

            APP_DIR="build/Payload/ColorWarAI.app"
            mkdir -p "$APP_DIR"
            
            # 复制二进制及模型资源
            cp -R build/App.xcarchive/Products/usr/local/bin/* "$APP_DIR/"
            
            # 生成 Info.plist
            if [ ! -f "$APP_DIR/Info.plist" ]; then
              PLIST_B64=""
              echo "$PLIST_B64" | base64 -d | sed "s/__BIN_NAME__/$BIN_NAME/g" > "$APP_DIR/Info.plist"
            fi

            printf "APPL????" > "$APP_DIR/PkgInfo"
            chmod +x "$APP_DIR/$BIN_NAME"
            echo "Successfully constructed .app bundle at $APP_DIR"
          else
            echo "ERROR: Neither .app bundle nor usr/local/bin found in xcarchive"
            find build/App.xcarchive -maxdepth 6 || true
            exit 1
          fi

          # 使用 macOS 原生 ditto 工具打包，完整保留符号链接与文件属性
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload ColorWarAI.ipa
          ditto -c -k --sequesterRsrc --keepParent Payload ColorWarAI.zip

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorWarAI-unsigned-ipa
          path: build/ColorWarAI.ipa

      - name: Upload ZIP Artifact (可直接双击解压查看)
        uses: actions/upload-artifact@v4
        with:
          name: ColorWarAI-unsigned-zip
          path: build/ColorWarAI.zip
