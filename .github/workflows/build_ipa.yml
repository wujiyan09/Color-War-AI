name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app and Live Activity extension
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild clean build \
            -project ColorWarAI.xcodeproj \
            -scheme ColorWarAI \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/ColorWarAI.app"
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/ColorWarLiveActivity.appex"
          test -s "$APP_PATH/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist" | grep -Fx 'ColorWarAI'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP_PATH/Info.plist" | grep -Fx 'ColorWarAI'
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.example.ColorWarAI' "$APP_PATH/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.example.ColorWarAI' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.example.ColorWarAI.LiveActivity' "$APP_PATH/PlugIns/ColorWarLiveActivity.appex/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.example.ColorWarAI.LiveActivity' "$APP_PATH/PlugIns/ColorWarLiveActivity.appex/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -Fx 'com.example.ColorWarAI'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/PlugIns/ColorWarLiveActivity.appex/Info.plist" | grep -Fx 'com.example.ColorWarAI.LiveActivity'
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr -y ColorWarAI.ipa Payload
          unzip -l ColorWarAI.ipa | grep -q 'PlugIns/ColorWarLiveActivity.appex/'
          unzip -l ColorWarAI.ipa | grep -q 'Assets.car'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: build/ColorWarAI.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
