name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # 允许创建 Release 并上传文件

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          set -euo pipefail

          SCHEME_NAME=$(xcodebuild -list -json | jq -r '(.workspace.schemes // .package.schemes // .project.schemes)[0] // empty')

          if [ -z "$SCHEME_NAME" ]; then
            echo "ERROR: 无法解析 Scheme"
            xcodebuild -list
            exit 1
          fi

          mkdir -p build

          xcodebuild archive \
            -scheme "$SCHEME_NAME" \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COREML_CODEGEN_LANGUAGE=Swift

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail

          mkdir -p build/Payload

          APP_PATH=$(find build/App.xcarchive -maxdepth 6 -name '*.app' -type d -print -quit || true)

          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/Payload/
          elif [ -d "build/App.xcarchive/Products/usr/local/bin" ]; then
            BIN_NAME=$(ls build/App.xcarchive/Products/usr/local/bin | grep -v '\.mlmodelc$' | head -n 1)
            APP_DIR="build/Payload/ColorWarAI.app"
            mkdir -p "$APP_DIR"
            cp -R build/App.xcarchive/Products/usr/local/bin/* "$APP_DIR/"
            
            PLIST_B64=""
            echo "$PLIST_B64" | base64 -d | sed "s/__BIN_NAME__/$BIN_NAME/g" > "$APP_DIR/Info.plist"

            printf "APPL????" > "$APP_DIR/PkgInfo"
            chmod +x "$APP_DIR/$BIN_NAME"
          fi

          # 打包真正的 .ipa 文件（带 -y 保留软链接）
          cd build
          zip -r -y ColorWarAI.ipa Payload

      # 发布到 GitHub Release，页面上会直接提供单文件 ColorWarAI.ipa 下载链接
      - name: Create Release & Upload Direct IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: build/ColorWarAI.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
