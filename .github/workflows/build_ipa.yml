name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # 允许创建 Release 并上传文件

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          set -euo pipefail

          SCHEME_NAME=$(xcodebuild -list -json | jq -r '(.workspace.schemes // .package.schemes // .project.schemes)[0] // empty')

          if [ -z "$SCHEME_NAME" ]; then
            echo "ERROR: 无法解析 Scheme"
            xcodebuild -list
            exit 1
          fi

          mkdir -p build

          # 指定 TARGETED_DEVICE_FAMILY="1,2" 同时支持 iPhone (1) 和 iPad (2)
          xcodebuild archive \
            -scheme "$SCHEME_NAME" \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COREML_CODEGEN_LANGUAGE=Swift

      - name: Package Unsigned IPA with iPad Multi-window Support
        run: |
          set -euo pipefail

          mkdir -p build/Payload

          APP_PATH=$(find build/App.xcarchive -maxdepth 6 -name '*.app' -type d -print -quit || true)

          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/Payload/
          elif [ -d "build/App.xcarchive/Products/usr/local/bin" ]; then
            BIN_NAME=$(ls build/App.xcarchive/Products/usr/local/bin | grep -v '\.mlmodelc$' | head -n 1)
            APP_DIR="build/Payload/ColorWarAI.app"
            mkdir -p "$APP_DIR"
            cp -R build/App.xcarchive/Products/usr/local/bin/* "$APP_DIR/"
            
            # 此 Base64 包含了完整适配 iPad 多窗口/台前调度/分屏所需的 Info.plist 字段：
            # 1. UIDeviceFamily: [1, 2] (支持 iPhone 与 iPad)
            # 2. UIRequiresFullScreen: false (允许非全屏多窗口)
            # 3. UILaunchScreen: {} (激活 dynamic window resizing)
            # 4. UISupportedInterfaceOrientations~ipad: 4个方向全覆盖
            # 5. UIApplicationSupportsMultipleScenes: true (多窗口支持)
            PLIST_B64=""
            echo "$PLIST_B64" | base64 -d | sed "s/__BIN_NAME__/$BIN_NAME/g" > "$APP_DIR/Info.plist"

            printf "APPL????" > "$APP_DIR/PkgInfo"
            chmod +x "$APP_DIR/$BIN_NAME"
          fi

          # 打包带软链接保留的 IPA
          cd build
          zip -r -y ColorWarAI.ipa Payload

      - name: Create Release & Upload Direct IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: build/ColorWarAI.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
