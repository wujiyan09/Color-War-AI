name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          SCHEME_NAME=$(xcodebuild -list -json | jq -r '(.project // .workspace // .package).schemes[0]')
          echo "Using scheme: $SCHEME_NAME"
          xcodebuild archive \
            -scheme "$SCHEME_NAME" \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COREML_CODEGEN_LANGUAGE=Swift \
            IPHONEOS_DEPLOYMENT_TARGET=17.0

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/App.xcarchive/Products/Applications/"*.app build/Payload/
          cd build
          zip -r ColorWarAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: build/ColorWarAI.ipa
